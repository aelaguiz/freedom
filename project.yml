name: CodexDock
options:
  bundleIdPrefix: com.aelaguiz
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CodexDock:
    type: framework
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CodexDock
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aelaguiz.CodexDock
  CodexDockApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CodexDockApp
    dependencies:
      - target: CodexDock
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aelaguiz.CodexDockApp
        DEVELOPMENT_TEAM: R6B8KXF3QW
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    info:
      path: CodexDockApp/Info.plist
      properties:
        CFBundleDisplayName: Codex Dock
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connect to the Mac Dock relay on your private network.
        NSBonjourServices:
          - _codexdock._tcp
        NSMicrophoneUsageDescription: Use the microphone for live tap or hold dictation into the Codex composer.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  CodexDockTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CodexDockTests
    dependencies:
      - target: CodexDock
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CodexDockApp:
    build:
      targets:
        CodexDockApp: all
        CodexDockTests: [test]
    test:
      targets:
        - CodexDockTests
      gatherCoverageData: false
